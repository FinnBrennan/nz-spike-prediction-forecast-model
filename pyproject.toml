[project]
name = "nz-spike-prediction-forecast-model"
version = "0.1.0"
description = "Forecasting model that uses hydro-lake storage levels to forecast wholesale-electricity-spot-prices spike risk in New Zealand."
readme = "README.md"
authors = [
    { name = "Finn Brennan", email = "127019042+FinnBrennan@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "duckdb>=2.0.0",
    "pandas>=3.1.1",
    "requests>=2.34.2",
]


[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nzspike"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
]
